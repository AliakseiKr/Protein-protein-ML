[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "protein-graph"
version = "0.1.0"
description = "A framework for protein interaction scoring and graph-based module discovery."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Aliaksei Kurachou" }
]
keywords = [
    "bioinformatics",
    "protein-interaction",
    "systems-biology",
    "machine-learning",
    "graph-analysis"
]
dependencies = [
    "pandas",
    "pyarrow",
    "requests",
    "tqdm"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff",
    "mypy"
]

[tool.setuptools.packages.find]
include = ["protein_graph*"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
